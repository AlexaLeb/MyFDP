services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: db
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"   # web UI
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  api:
    build: ./app
    env_file: ./app/.env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - MODEL_DIR=/app/ml_models
    ports:
      - "8080:8080"
    volumes:
      - ./ml_models:/app/ml_models:ro   # модели монтируем, в образ не кладём
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  worker:
    build: ./app
    command: python -m worker.worker
    working_dir: /app
    env_file: ./app/.env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - MODEL_DIR=/app/ml_models
      - PYTHONPATH=/app
    volumes:
      - ./ml_models:/app/ml_models:ro
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    # Масштабирование: docker compose up --scale worker=3

  streamlit:
    build: ./streamlit_app
    environment:
      - API_URL=http://api:8080
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - streamlit
    restart: on-failure

volumes:
  postgres_volume:
